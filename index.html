<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://api.github.com https://gist.githubusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance OS">
<meta name="robots" content="noindex">
<title>Finance OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0B0C0F;--bg2:#101116;--card:#15171C;--card2:#1B1D23;--line:#25272E;--line2:#30333B;
  --tx:#F3F3F5;--tx2:#A2A5AE;--tx3:#6E717B;
  --gold:#E7C36E;--gold2:#F5DA9A;--goldbg:rgba(231,195,110,.12);
  --pos:#3DD598;--posbg:rgba(61,213,152,.12);--neg:#FF6B7A;--negbg:rgba(255,107,122,.12);--warn:#F2B25C;--warnbg:rgba(242,178,92,.12);
  --info:#8EA6FF;--infobg:rgba(142,166,255,.12);
  --r:20px;--r2:14px;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F3EF;--bg2:#ECEBE6;--card:#FFFFFF;--card2:#F7F6F2;--line:#E6E4DE;--line2:#D8D5CD;
  --tx:#111215;--tx2:#5C5F68;--tx3:#8E9099;
  --gold:#B8862B;--gold2:#8F6619;--goldbg:rgba(184,134,43,.12);
  --pos:#0E9F6E;--posbg:rgba(14,159,110,.10);--neg:#D9364A;--negbg:rgba(217,54,74,.09);--warn:#C27A12;--warnbg:rgba(194,122,18,.10);
  --info:#3E5BD8;--infobg:rgba(62,91,216,.09);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--tx)}
.num,.big,.amt,.kpi b{font-variant-numeric:tabular-nums}
.hide .amt{filter:blur(7px);user-select:none}

/* layout */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
.top h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:700;flex:1}
.top .sub{color:var(--tx3);font-size:13px;font-weight:500;display:block;letter-spacing:0}
.icb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.icb:hover{color:var(--tx)}
.icb svg{width:18px;height:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);display:inline-block}
.dot.ok{background:var(--pos)}.dot.busy{background:var(--gold)}.dot.err{background:var(--neg)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--tx3);padding:4px 0}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--gold)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:31;width:54px;height:54px;border-radius:18px;background:var(--gold);color:#17130A;display:grid;place-items:center;box-shadow:0 10px 30px rgba(231,195,110,.28)}
.fab svg{width:24px;height:24px}

@media (min-width:920px){
  .side{display:flex;flex-direction:column;gap:4px;width:236px;flex:none;position:sticky;top:0;height:100vh;align-self:flex-start;padding:26px 16px;border-right:1px solid var(--line);background:var(--bg2)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0 8px 26px}
  .logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--gold2),var(--gold));display:grid;place-items:center;color:#17130A;font-style:normal;font-weight:800;font-size:15px}
  .side .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--tx2);font-weight:600;font-size:14px;text-align:left}
  .side .nav svg{width:19px;height:19px}
  .side .nav:hover{background:var(--card)}
  .side .nav.on{background:var(--card);color:var(--tx);box-shadow:inset 3px 0 0 var(--gold)}
  .side .cta{margin-top:18px;justify-content:center}
  .side .foot{margin-top:auto;font-size:12px;color:var(--tx3);padding:0 10px;display:flex;align-items:center;gap:8px}
  .tabs,.fab{display:none}
  .main{padding:28px 36px 60px}
  .top h1{font-size:30px}
}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 2px;font-weight:650;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-size:13px;color:var(--tx3);font-weight:500}
.card .lead{color:var(--tx3);font-size:13px;margin:0 0 14px}
.eyebrow{color:var(--tx2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.big{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:6px 0 4px}
@media (min-width:920px){.big{font-size:48px}}
.delta{font-size:13.5px;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--tx3)}.gold{color:var(--gold)}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media (min-width:920px){.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g32{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.grid>.card{margin-bottom:0}.grid{margin-bottom:14px}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (min-width:920px){.kpis{grid-template-columns:repeat(4,1fr);gap:14px}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;box-shadow:var(--shadow)}
.kpi>span{display:block;color:var(--tx3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:21px;letter-spacing:-.02em;margin-top:4px;font-weight:700}
.kpi small{display:block;font-size:12px;color:var(--tx3);margin-top:2px}

.hero{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--gold) 9%,var(--card)) 0%,var(--card) 55%);padding:22px}
.chart{position:relative;margin-top:14px}
.chart svg{display:block;width:100%}
.xl{display:flex;justify-content:space-between;color:var(--tx3);font-size:11.5px;margin-top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);font-weight:600;font-size:14px}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#17130A}
.btn.dng{color:var(--neg)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn svg{width:16px;height:16px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:var(--goldbg);color:var(--gold);font-size:12.5px;font-weight:650}

/* allocation bars */
.alloc{display:flex;flex-direction:column;gap:16px}
.al-h{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600}
.al-h i{width:9px;height:9px;border-radius:3px;flex:none;align-self:center}
.al-h .v{margin-left:auto;font-variant-numeric:tabular-nums}
.al-h .t{color:var(--tx3);font-weight:500;font-size:12.5px}
.bar{position:relative;height:9px;border-radius:9px;background:var(--card2);margin-top:8px;overflow:visible}
.bar>b{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.bar>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx);opacity:.55;border-radius:2px;text-decoration:none}
.al-s{font-size:12.5px;margin-top:6px;color:var(--tx3)}
.stack{display:flex;height:12px;border-radius:12px;overflow:hidden;background:var(--card2);gap:2px}
.stack b{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:3px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);text-align:left;width:100%;border-radius:0}
.list>.li:first-child{border-top:0}
button.li:hover{background:color-mix(in srgb,var(--card2) 60%,transparent)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none}
.li .m{flex:1;min-width:0}
.li .n{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.li .v small{display:block;font-weight:500;font-size:12px;color:var(--tx3)}
.li .mini{height:5px;border-radius:5px;background:var(--card2);margin-top:7px;overflow:hidden}
.li .mini b{display:block;height:100%;border-radius:5px}
.plus{width:30px;height:30px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold);flex:none}
.plus svg{width:15px;height:15px}
.zero .n,.zero .v{color:var(--tx3);font-weight:500}

.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sec-h i{width:10px;height:10px;border-radius:4px}
.sec-h h2{margin:0}
.sec-h .tot{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sec-h .tot small{display:block;font-size:12px;color:var(--tx3);font-weight:500}
.add{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:600;font-size:13.5px;padding:12px 4px 2px}
.add svg{width:16px;height:16px}

/* month switcher */
.msw{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.msw .lbl{font-weight:700;font-size:17px;flex:1;text-align:center;text-transform:capitalize}
@media (min-width:920px){.msw{max-width:420px}}

/* insights */
.ins{display:flex;gap:12px;padding:12px;border-radius:14px;margin-top:8px}
.ins .b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:800}
.ins h3{margin:0;font-size:14px;font-weight:650}
.ins p{margin:2px 0 0;font-size:13px;color:var(--tx2)}
.ins.bad{background:var(--negbg)}.ins.bad .b{background:var(--neg);color:#fff}
.ins.warn{background:var(--warnbg)}.ins.warn .b{background:var(--warn);color:#1a1205}
.ins.good{background:var(--posbg)}.ins.good .b{background:var(--pos);color:#04140d}
.ins.info{background:var(--infobg)}.ins.info .b{background:var(--info);color:#fff}

/* bars chart */
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bars .grp{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bars .grp b{width:28%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:2px}
.bars .col span{font-size:11px;color:var(--tx3)}
.bars .col.on span{color:var(--tx);font-weight:700}

/* donut */
.donut{position:relative;width:170px;height:170px;margin:4px auto 6px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font-size:19px;letter-spacing:-.02em}
.donut .c span{font-size:12px;color:var(--tx3)}
.dwrap{display:flex;flex-direction:column;gap:10px}
@media (min-width:620px){.dwrap{flex-direction:row;align-items:center;gap:24px}.dwrap .list{flex:1}}

/* ring */
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--tx2)}
.inp{height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);padding:0 13px;font-size:16px;width:100%;outline:none}
.inp:focus{border-color:var(--gold)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:13px;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.big-inp{font-size:34px;font-weight:700;text-align:center;height:64px;letter-spacing:-.02em}
input[type=range]{width:100%;accent-color:var(--gold)}
.sim-row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:4px}
.sim-row b{font-variant-numeric:tabular-nums;color:var(--gold)}

/* method cards */
.mcard{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:var(--card2);border-radius:14px;padding:14px;margin-bottom:8px}
.mcard.on{border-color:var(--gold);background:var(--goldbg)}
.mcard b{display:flex;align-items:center;gap:8px;font-size:14.5px}
.mcard p{margin:4px 0 8px;font-size:13px;color:var(--tx2)}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:38px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 16px;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center}
.sheet h3 button{margin-left:auto}
@media (min-width:620px){.ov{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.empty{text-align:center;padding:30px 10px}
.empty .e{font-size:40px}
.empty h2{justify-content:center;font-size:19px;margin:10px 0 6px}
.empty p{color:var(--tx2);max-width:420px;margin:0 auto 18px}
.note{font-size:12.5px;color:var(--tx3);margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:60;animation:up .2s ease}
@media (min-width:920px){.toast{bottom:30px}}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--tx2)}
hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
